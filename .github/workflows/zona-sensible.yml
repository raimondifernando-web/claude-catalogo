# Check obligatorio `zona-sensible` para unir a `main` (ruleset `proteger-main`).
# Decisión del dueño (2026-10-14): su OK queda SOLO para lo que corre solo en la Mac del cliente (hooks y lo que
# llaman, MCP, el instalador, manifiestos que cambian qué se ejecuta) y para los propios controles. Si un PR toca eso,
# este check falla hasta que el dueño le pone la etiqueta `ok-fernando`. Si después del OK llegan commits nuevos que
# siguen tocando la zona, la etiqueta se saca sola: el OK vale para lo que vio, no para lo que venga.
#
# Seguridad:
#   - `pull_request_target`: corre SIEMPRE la versión de `main` de este archivo y de scripts/zona-sensible.py, así
#     que un PR no puede apagar su propio control;
#   - el código del PR se TRAE para leerlo (git diff / git show), nunca se ejecuta ni se instala nada de él;
#   - el número de PR y las etiquetas entran por variables de entorno, jamás dentro del código del paso;
#   - permisos mínimos: leer el repo y, solo para sacar una etiqueta vencida, escribir en el PR;
#   - `workflow_dispatch` existe para el robot del radar (sus PR no disparan eventos); sin PR no hay etiqueta: si toca
#     la zona sensible, falla.
name: zona-sensible

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zona-sensible-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zona-sensible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: ¿Toca lo que corre solo en la Mac del cliente?
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ACCION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ETIQUETAS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REF_MANUAL: ${{ github.ref }}
        run: |
          set -uo pipefail
          if [ "$EVENTO" = "pull_request_target" ]; then
            git fetch --no-tags -q origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
            base="$BASE_SHA"; head="$HEAD_SHA"
          else
            git fetch --no-tags -q origin "+${REF_MANUAL}:refs/remotes/pr/head"
            head=$(git rev-parse refs/remotes/pr/head); base=$(git rev-parse origin/main)
          fi
          python3 scripts/zona-sensible.py --base "$base" --head "$head"; rc=$?
          [ "$rc" -eq 0 ] && exit 0
          [ "$rc" -ne 10 ] && { echo "::error::zona-sensible no pudo revisar el PR (código $rc): no se une"; exit 1; }
          tiene_ok=$(printf '%s' "${ETIQUETAS:-[]}" | python3 -c 'import json,sys; print("si" if "ok-fernando" in json.load(sys.stdin) else "no")')
          if [ "$tiene_ok" = si ] && [ "$ACCION" = synchronize ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ok-fernando >/dev/null \
              || echo "::warning::no pude sacar la etiqueta vencida"
            echo "::error::llegaron commits nuevos después del OK: la etiqueta ok-fernando se sacó; hace falta un OK nuevo"
            exit 1
          fi
          if [ "$tiene_ok" = si ]; then
            echo "::notice::zona sensible con OK del dueño (etiqueta ok-fernando)"
            exit 0
          fi
          echo "::error::este cambio toca lo que corre solo en la Mac del cliente: necesita el OK del dueño (etiqueta ok-fernando)"
          exit 1
