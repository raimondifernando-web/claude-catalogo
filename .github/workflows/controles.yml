# Check obligatorio `controles` para unir a `main` (ruleset `proteger-main`, archivo en .github/rulesets/).
# Decisión del dueño (2026-10-14): «reemplazá mi OK para unir a main por controles automáticos». Toda unión a `main`
# va por PR; este check corre las pruebas (scripts/controles.sh) y la sesión une con `gh pr merge --auto`: GitHub
# espera a que pasen este check y `zona-sensible` y recién ahí une. Lo que entra a `main` llega a los clientes
# 48 h después por la rama `estable` (estable.yml), así que un error tiene tiempo de verse y revertirse.
#
# Seguridad:
#   - corre con `pull_request` (el código del PR, con permisos de solo lectura); NUNCA `pull_request_target` acá;
#   - sin secretos: la lista de nombres de clientes la revisa zona-sensible.yml con el código de main;
#   - un PR que cambie este archivo o los scripts de control cae en la zona sensible (zona-sensible.yml, que corre
#     siempre la versión de `main`) y necesita la etiqueta `ok-fernando-<commit>`, que pone solo el dueño;
#   - `workflow_dispatch` existe para el robot del radar: sus PR los abre GITHUB_TOKEN, que no dispara `pull_request`.
name: controles

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    # En Mac, como las computadoras de los clientes: varias pruebas del método son de macOS (firmlinks, lanzadores).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Sin secretos: el control de nombres de clientes corre en zona-sensible.yml con el código de main.
      - name: Librería que usan las pruebas (versión fija)
        run: python -m pip install --disable-pip-version-check -q "pyyaml==6.0.2"
      - name: Controles (metadatos y pruebas)
        env:
          SIN_NOMBRES: "1"
        run: |
          set -euo pipefail
          git config --global user.email "controles@localhost"   # algunas pruebas crean repos de juguete
          git config --global user.name "controles"
          bash scripts/controles.sh
