# Radar de modelos: lee fuentes PÚBLICAS (sin claves, sin IA) y, solo si hay un cambio relevante, abre un PR con el diff
# de plugins/metodo/radar/RADAR.yaml y lo publica solo (decisión del dueño, 2026-10-03: «automático, de forma segura»).
#   - diario  (retiros y precios): LiteLLM, OpenRouter, models.dev y las tablas de las páginas de retiros
#   - semanal (rankings): dataset de Arena en Hugging Face
# Se publica solo si TODO esto se cumple; si algo falla, el PR queda abierto para una persona:
#   1. el commit toca únicamente RADAR.yaml, RADAR.md y MODELOS.json (datos, nunca programas; los clientes los leen con un
#      lector propio que no ejecuta nada) · 2. radar.py los lee y los tests pasan · 3. el cambio no borra más de la mitad del
#      archivo · 4. la credencial de escritura existe solo en el último paso (no mientras se leen páginas de terceros) ·
#      5. no se toca `radar/consejos/` (los resúmenes los hace una persona o la IA barata, nunca este robot).
#      Modelos nuevos, vigentes, precios, rankings, retiros y cambios en la doc oficial son DATOS y se publican solos
#      (2026-10-29, pedido del dueño: antes, un modelo vigente o una página de doc nueva dejaban el PR esperando a una persona
#      que nadie avisaba, y el radar se pudrió 16 días). Lo que pide trabajo humano (rehacer un resumen de consejos, una fila
#      de FUNCIONES.md, el orden A/B/C) no frena los datos: queda marcado en RADAR.yaml (`cambio:`) y `radar.py hoy` lo avisa en
#      cada sesión hasta que se haga. El catálogo de modelos se arma sin reglas por modelo (`radar_modelos.py`).
# El orden A/B/C de cada categoría NO lo toca este robot: se escribe a mano (spec §7).
# Requiere, en Settings > Actions > General, «Allow GitHub Actions to create and approve pull requests».
name: radar

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días
    - cron: "43 6 * * 1"   # lunes
  workflow_dispatch:
    inputs:
      modo:
        description: "diario, semanal o todo"
        default: "todo"

permissions:
  contents: write        # empujar la rama del PR
  pull-requests: write   # abrir el PR
  actions: write         # pedir los checks obligatorios sobre la rama del PR (controles y zona-sensible)

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # la credencial se pone recién en el último paso
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Elegir el modo
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          ENTRADA: ${{ github.event.inputs.modo }}
        run: |
          case "$EVENTO:$CRON" in
            schedule:"43 6 * * 1") m=semanal ;;
            schedule:*) m=diario ;;
            *) m="${ENTRADA:-todo}" ;;
          esac
          case "$m" in diario|semanal|todo) ;; *) m=todo ;; esac
          echo "modo=$m" >> "$GITHUB_OUTPUT"
      - name: Leer las fuentes y actualizar RADAR.yaml
        id: radar
        env:
          RADAR_CATALOGO: "1"   # arma también el catálogo de modelos (MODELOS.json); sin esto radar-fuentes.py no lo toca
        run: python3 scripts/radar-fuentes.py --modo "${{ steps.modo.outputs.modo }}" --motivo "$RUNNER_TEMP/motivo.md"
      - name: Probar el radar nuevo (los PR que abre el bot no disparan otros workflows)
        if: steps.radar.outputs.hay_cambios == 'true'
        env:
          RADAR_AUTO: "0"   # `radar.py hoy` no lanza su actualización en segundo plano dentro del robot
        run: |
          python3 plugins/metodo/scripts/radar.py ver >/dev/null
          python3 plugins/metodo/scripts/radar.py modelos >/dev/null
          n=$(python3 plugins/metodo/scripts/radar.py hoy | wc -l)
          if [ "$n" -lt 4 ] || [ "$n" -gt 6 ]; then echo "radar.py hoy imprime $n líneas (tienen que ser de 4 a 6)"; exit 1; fi
          python3 -m unittest discover -s plugins/metodo/scripts/tests -p 'test_radar.py' -q
          python3 -m unittest discover -s plugins/metodo/scripts/tests -p 'test_ruteo.py' -q
          python3 -m unittest discover -s plugins/metodo/scripts/tests -p 'test_radar_modelos.py' -q
          python3 -m unittest discover -s plugins/metodo/scripts/tests -p 'test_radar_modelos.py' -q
      - name: Abrir o actualizar el PR (solo si hubo un cambio relevante)
        if: steps.radar.outputs.hay_cambios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # Rama fija: mientras el PR no se apruebe, cada corrida lo actualiza en vez de abrir uno nuevo.
          rama="radar/auto"
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git checkout -B "$rama"
          git add plugins/metodo/radar/RADAR.yaml plugins/metodo/radar/RADAR.md plugins/metodo/radar/MODELOS.json
          git commit -m "radar: actualización automática de fuentes públicas"

          # Guardias para publicar solo (si alguna falla, el PR se abre igual y queda para una persona).
          publicar=si
          fuera="$(git diff --name-only HEAD~1 HEAD | grep -v -x -E 'plugins/metodo/radar/(RADAR\.(yaml|md)|MODELOS\.json)' || true)"
          if [ -n "$fuera" ]; then
            publicar=no; echo "::warning::el cambio toca archivos que no son datos del radar; queda para revisión"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q '^plugins/metodo/radar/consejos/'; then
            publicar=no; echo "::warning::el cambio toca radar/consejos/; queda para revisión"
          fi
          antes=$(git show HEAD~1:plugins/metodo/radar/RADAR.yaml | wc -l)
          ahora=$(wc -l < plugins/metodo/radar/RADAR.yaml)
          if [ "$ahora" -lt $((antes / 2)) ]; then
            publicar=no; echo "::warning::RADAR.yaml pasa de $antes a $ahora líneas; queda para revisión"
          fi

          # Recién acá existe la credencial de escritura (no mientras se leyeron páginas de terceros).
          gh auth setup-git
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" "$rama"
          if gh pr view "$rama" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$rama" --body-file "$RUNNER_TEMP/motivo.md"
          else
            gh pr create --base "$BASE" --head "$rama" \
              --title "radar: cambios en las fuentes públicas" --body-file "$RUNNER_TEMP/motivo.md"
          fi
          # main solo acepta PR con los checks `controles` y `zona-sensible` (ruleset proteger-main). Un PR abierto con
          # GITHUB_TOKEN no dispara `pull_request`, así que el robot los pide SIEMPRE sobre su rama (también cuando el PR
          # queda para una persona: sin los checks, nadie podría unirlo).
          gh workflow run controles.yml --ref "$rama" && gh workflow run zona-sensible.yml --ref "$rama" \
            || echo "::warning::no pude pedir los checks; el PR queda abierto para una persona"
          # La unión se encola (--auto) solo si pasaron las guardias Y main de verdad exige los checks: sin el ruleset,
          # --auto uniría al instante. En cualquier otro caso se desarma una unión que haya quedado encolada de otra corrida.
          exige=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${BASE}" \
            --jq '[.[] | select(.type=="required_status_checks")] | length' 2>/dev/null || echo 0)
          if [ "$publicar" = si ] && [ "${exige:-0}" -gt 0 ]; then
            gh pr merge "$rama" --squash --auto \
              || echo "::warning::no se pudo encolar la publicación; el PR queda abierto para una persona"
          else
            gh pr merge "$rama" --disable-auto >/dev/null 2>&1 || true
            if [ "$publicar" = si ]; then
              echo "::warning::main no exige los checks: no se publica solo; el PR queda para una persona"
            fi
          fi
