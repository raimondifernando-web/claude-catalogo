# Tests del vigía de actualizaciones, del buzón y de la rama `estable` (plugin metodo) en Mac, Linux y Windows.
# Sin secretos, sin red real (los tests simulan GitHub/npm/PyPI) y con permisos de solo lectura.
name: vigia-tests

on:
  push:
    paths:
      - "plugins/metodo/scripts/vigia/**"
      - "plugins/metodo/hooks/**"
      - "plugins/metodo/scripts/buzon.py"
      - "plugins/metodo/scripts/radar.py"
      - "plugins/metodo/radar/**"
      - "scripts/radar-fuentes.py"
      - "scripts/estable-avanzar.py"
      - "plugins/metodo/scripts/tests/**"
      - ".github/workflows/vigia-tests.yml"
      - ".github/workflows/estable.yml"
      - ".github/rulesets/**"
  pull_request:
    paths:
      - "plugins/metodo/scripts/vigia/**"
      - "plugins/metodo/hooks/**"
      - "plugins/metodo/scripts/buzon.py"
      - "plugins/metodo/scripts/radar.py"
      - "plugins/metodo/radar/**"
      - "scripts/radar-fuentes.py"
      - "scripts/estable-avanzar.py"
      - "plugins/metodo/scripts/tests/**"
      - ".github/workflows/vigia-tests.yml"
      - ".github/workflows/estable.yml"
      - ".github/rulesets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: unittest
        run: python -m unittest discover -s plugins/metodo/scripts/vigia/tests -v
      - name: unittest del buzón, del radar y de estable
        run: python -m unittest discover -s plugins/metodo/scripts/tests -v

  hook-bash:
    # El comando REAL de hooks/hooks.json, corrido con bash (en Windows, Git Bash) desde
    # rutas con espacios, con un python3 falso primero en el PATH (como el alias de la
    # Microsoft Store). Exige: hook < 1,5 s, un solo aviso, y que el detector termine
    # solo DESPUÉS de matar el árbol del proceso del hook (Windows: taskkill /F /T;
    # POSIX: el grupo). Detalle en plugins/metodo/scripts/vigia/tests/ci_hook.py.
    name: comando del hook con bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: hook de punta a punta
        shell: bash
        run: |
          set -euo pipefail
          BASH_EXE="$(command -v bash)"
          if command -v cygpath >/dev/null 2>&1; then
            BASH_EXE="$(cygpath -w "$BASH_EXE")"  # el bash de Git for Windows, no el de WSL
          fi
          unset GH_TOKEN GITHUB_TOKEN || true
          python plugins/metodo/scripts/vigia/tests/ci_hook.py --bash "$BASH_EXE"
