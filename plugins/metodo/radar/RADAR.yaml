ruteo_claude:
  nota: "Punto de partida de nivel y esfuerzo de Claude por tipo de tarea. Cada fila cita la evidencia INDEPENDIENTE de este mismo radar que la respalda (spec §7). Donde no hay medición, la fila queda verificado: false y vale el valor por defecto de la política de modelos tal cual (0 «sí» a ¿hay que juzgar o decidir?, ¿equivocarse sale caro?, ¿hay mucho contexto? = haiku/low · 1 = sonnet/medium · 2 = opus/high · 3 = fable/xhigh): se baja un escalón solo cuando hay duda entre dos, no por falta de datos. Si la tarea tiene más «sí» de los que supone la fila, se sube un escalón por cada uno. Fable solo a pedido, max solo a pedido. Lo escribe una persona a mano: el robot no lo toca."
  tareas:
    - id: buscar_mover
      corto: "buscar, contar, mover o resumir"
      tarea: "Buscar, contar, listar, mover, renombrar o resumir algo ya decidido"
      nivel: haiku
      esfuerzo: low
      otra_ia: tareas_baratas
      verificado: false
      sin_dato: "El radar no mide a Claude Haiku en esta categoría (solo GPT-6 Luna y GPT-6.1 Sol). haiku/low es el piso de la escala."
      evidencia: []
      palabras: [buscar, busqueda, search, listar, listado, contar, count, renombrar, rename, mover, resumir, resumen, summar*, inventario, grep, encontrar, ubicar]
    - id: implementar_acotado
      corto: "implementar algo acotado"
      tarea: "Implementar algo acotado: un arreglo claro, un script, una función, tests"
      nivel: sonnet
      esfuerzo: low
      otra_ia: desarrollo
      verificado: false
      sin_dato: "Nivel: dos fuentes independientes. Esfuerzo: las mediciones solo traen variantes xhigh y max (Arena) y no comparan medium ni low; sin dato, ante la duda entre low y medium, el de abajo."
      evidencia:
        - dato: nivel
          categoria: desarrollo
          fuente: "Artificial Analysis Coding Agent Index v1.5"
        - dato: nivel
          categoria: diseno
          fuente: "Arena WebDev"
      palabras: [implement*, arreglar, corregir, fix, fixes, bug, bugs, refactor, agregar, test, tests, testing, script, codigo, code, coding, parche, patch, funcion]
    - id: revisar
      corto: "revisar o dar segunda opinión"
      tarea: "Revisar un cambio o dar una segunda opinión"
      nivel: sonnet
      esfuerzo: medium
      otra_ia: revision
      verificado: false
      sin_dato: "La categoría «revisión de código y seguridad» no tiene evidencia independiente cargada (orden provisorio): vale la política de modelos. Revisar juzga y el error sale caro (2 «sí» de 3 se cumplen a medias): sonnet/medium. La segunda opinión conviene mandarla antes a otra IA con cupo."
      evidencia: []
      palabras: [revis*, review, critic, segunda opinion, verific*, chequear]
    - id: planillas
      corto: "planillas y datos"
      tarea: "Planillas, conciliaciones y análisis de datos"
      nivel: sonnet
      esfuerzo: low
      otra_ia: datos_planillas
      verificado: false
      sin_dato: "Nivel: una fuente independiente (Claude Sonnet 5.5 queda 2° en AnalystAgent). Esfuerzo: sin medición; ante la duda entre low y medium, el de abajo."
      evidencia:
        - dato: nivel
          categoria: datos_planillas
          fuente: "Artificial Analysis AnalystAgent y GDP.pdf"
      palabras: [planilla, excel, xlsx, csv, spreadsheet, conciliar, conciliacion]
    - id: investigar
      corto: "investigar en la web"
      tarea: "Investigar en la web y juntar fuentes"
      nivel: sonnet
      esfuerzo: low
      otra_ia: investigacion_web
      verificado: false
      sin_dato: "Arena búsqueda no trae modelos Claude de septiembre (el único Claude es Opus 4.6): sin dato vale la política de modelos (una pregunta con «sí»: hay que juntar y contrastar fuentes → sonnet; ante la duda entre low y medium, el de abajo)."
      evidencia: []
      palabras: [investig*, research, en la web, relevar, relevamiento, scrap*]
    - id: arquitectura_seguridad_plata
      corto: "arquitectura, seguridad o plata"
      tarea: "Arquitectura, seguridad, dinero o algo irreversible (planear en Claude; la revisión puede ir a otra IA)"
      nivel: opus
      esfuerzo: high
      otra_ia: revision
      verificado: false
      sin_dato: "No hay evidencia independiente de arquitectura ni de seguridad (revisión sin fuentes): vale la política de modelos tal cual. Hay que juzgar y el error sale caro (2 «sí») → opus/high."
      evidencia: []
      palabras: [arquitectur*, architect, seguridad, security, vulnerab*, dinero, plata, pago, payment, finanz*, financ*, legal, legales, contrato, irreversible, produccion, production, migracion, diseno de sistema]
