        modelo: Opus 5.5
        modelo_api: claude-opus-5-5
        por_que: "Primero en Arena Agent (20,9) y en Terminal-Bench 4.0 (64,8%). Fable 5.1 (más caro) ya no es el primero: 4.º en Arena Agent (13,4) y 5.º en Terminal-Bench (57,9%), debajo de Opus 5.5 y Sonnet 5.5."
        fuente: "evidencia de la categoría"
        fecha: 2026-10-29
        datos_privados: true
        condiciones: ""
        como_ver_cupo: /usage en Claude Code
        cupo: claude
        verificado: true
        respaldo:
          - Arena Agent
          - "Terminal-Bench 4.0 (tabla de Snorkel AI)"
      - plan: B
        herramienta: Codex
        proveedor: OpenAI
        modelo: GPT-6.1 Sol
        modelo_api: gpt-6.1-sol
        por_que: "6.º en Arena Agent (12,5; GPT-6 Astra, 5.º con 13,0) y 58,2% en Terminal-Bench 4.0, igual que Astra y a menos de una quinta parte del costo en esa tabla."
        fuente: docs/specs/INVESTIGACION-radar-de-modelos.md
        fecha: 2026-10-29
        datos_privados: true
        condiciones: ""
        como_ver_cupo: "/status en Codex, o bash scripts/codex-cupo"
        cupo: codex
        verificado: true
        respaldo:
          - Arena Agent
          - "Terminal-Bench 4.0 (tabla de Snorkel AI)"
      - plan: C
        herramienta: Antigravity
        proveedor: Google
        modelo: Gemini 4 Argon
        modelo_api: gemini-4-argon
        por_que: "7.º en Arena Agent (10,7), debajo de GPT-6.1 Sol (12,5). Gemini 4 Carbon es 2.º en Arena Agent (16,0) pero todavía no tiene acceso general: cuando salga pasa a plan B. Alternativa para tareas acotadas."
        fuente: docs/specs/INVESTIGACION-radar-de-modelos.md
        fecha: 2026-10-29
        datos_privados: false
        condiciones: "Gemini 4 Argon en Antigravity es solo para suscriptores de Google AI Ultra (en la app de Gemini, desde AI Pro; por API, US$2/10 por millón hasta el 30/11/2026 y US$4/20 después, según Google). Con otra cuenta, Antigravity usa el mejor Gemini que tenga (delegar.py lo resuelve solo). En el plan gratis Google usa lo que mandás para mejorar sus productos: sin código privado ni datos de clientes."
        como_ver_cupo: /usage en Antigravity CLI
        cupo: antigravity
        verificado: false
        respaldo:
          - Arena Agent
