ruteo_claude:
  nota: "Punto de partida de nivel y esfuerzo de Claude por tipo de tarea. Cada fila cita la evidencia INDEPENDIENTE de este mismo radar que la respalda (spec §7). Donde no hay medición, la fila queda verificado: false y vale el valor por defecto de la política de modelos tal cual (0 «sí» a ¿hay que juzgar o decidir?, ¿equivocarse sale caro?, ¿hay mucho contexto? = haiku/low · 1 = sonnet/medium · 2 = opus/high · 3 = fable/xhigh): se baja un escalón solo cuando hay duda entre dos, no por falta de datos. Si la tarea tiene más «sí» de los que supone la fila, se sube un escalón por cada uno. Fable solo a pedido, max solo a pedido. Lo escribe una persona a mano: el robot no lo toca."
  tareas:
    - id: buscar_mover
      corto: "buscar, contar, mover o resumir"
      tarea: "Buscar, contar, listar, mover, renombrar o resumir algo ya decidido"
      nivel: haiku
      esfuerzo: low
      otra_ia: tareas_baratas
      verificado: false
      sin_dato: "Claude Haiku 5.5 ya se mide en «tareas baratas» (índice de Artificial Analysis 43 a US$0,21 por tarea, el más alto de los baratos; GPT-6 Luna, 38 a US$0,07), pero nadie mide «buscar, mover o resumir» como tal. haiku/low es el piso de la escala."
      evidencia:
        - dato: nivel
          categoria: tareas_baratas
          fuente: Artificial Analysis LLM Leaderboard
      palabras:
        - buscar
        - busqueda
        - search
        - listar
        - listado
        - contar
        - count
        - renombrar
        - rename
        - mover
        - resumir
        - resumen
        - "summar*"
        - inventario
        - grep
        - encontrar
        - ubicar
    - id: implementar_acotado
      corto: implementar algo acotado
      tarea: "Implementar algo acotado: un arreglo claro, un script, una función, tests"
      nivel: sonnet
      esfuerzo: low
      otra_ia: desarrollo
      verificado: false
      sin_dato: "Nivel: tres fuentes independientes (Claude Code con Sonnet 5.5: 59 contra 62 de Opus 5.5 en el índice de Artificial Analysis, 61,8% contra 64,8% en Terminal-Bench, 3.º contra 1.º en Arena WebDev). Esfuerzo: las mediciones solo traen variantes xhigh y max (Arena) y no comparan medium ni low; sin dato, ante la duda entre low y medium, el de abajo."
      evidencia:
        - dato: nivel
          categoria: desarrollo
          fuente: Artificial Analysis Coding Agent Index v2.0
        - dato: nivel
          categoria: diseno
          fuente: Arena WebDev
        - dato: nivel
          categoria: desarrollo
          fuente: "Terminal-Bench 4.0 (tabla de Snorkel AI)"
      palabras:
        - "implement*"
        - arreglar
        - corregir
        - fix
        - fixes
        - bug
        - bugs
        - refactor
        - agregar
        - test
        - tests
        - testing
        - script
        - codigo
        - code
        - coding
        - parche
        - patch
        - funcion
    - id: revisar
      corto: "revisar o dar segunda opinión"
      tarea: "Revisar un cambio o dar una segunda opinión"
      nivel: sonnet
      esfuerzo: medium
      otra_ia: revision
      verificado: false
      sin_dato: "Nivel: dos fuentes independientes (Qodo e ironbee): Claude Sonnet 5.5 queda a 2 puntos de Opus 5.5 revisando, a menos costo. Esfuerzo: las fuentes no coinciden (ironbee midió mejor en low, Qodo corrió en high); vale la política de modelos: revisar juzga y el error sale caro (2 «sí» de 3 se cumplen a medias) → sonnet/medium. La segunda opinión conviene mandarla antes a otra IA con cupo."
      evidencia:
        - dato: nivel
          categoria: revision
          fuente: "Qodo, ¿qué modelo conviene para revisar código? (13 modelos)"
        - dato: nivel
          categoria: revision
          fuente: "ironbee-ai/code-review-benchmarks (21 modelos, 50 pull requests)"
      palabras:
        - "revis*"
        - review
        - critic
        - segunda opinion
        - "verific*"
        - chequear
    - id: planillas
      corto: planillas y datos
      tarea: "Planillas, conciliaciones y análisis de datos"
      nivel: sonnet
      esfuerzo: low
      otra_ia: datos_planillas
      verificado: false
      sin_dato: "Nivel: dos fuentes independientes (Claude Sonnet 5.5 lidera el Vals Index v2.2 con 70,85% y queda 2.º en AnalystAgent). Esfuerzo: sin medición; ante la duda entre low y medium, el de abajo."
      evidencia:
        - dato: nivel
          categoria: datos_planillas
          fuente: Artificial Analysis AnalystAgent y GDP.pdf
        - dato: nivel
          categoria: datos_planillas
          fuente: "Vals AI, modelado en Excel y finanzas"
      palabras:
        - planilla
        - excel
        - xlsx
        - csv
        - spreadsheet
        - conciliar
        - conciliacion
    - id: investigar
      corto: investigar en la web
      tarea: Investigar en la web y juntar fuentes
      nivel: sonnet
      esfuerzo: low
      otra_ia: investigacion_web
      verificado: false
      sin_dato: "Arena búsqueda (13/10) trae Claude Fable 5.1 (5.º), Opus 5 (6.º) y Opus 5.5 en esfuerzo medio (14.º, 1213) pero no Sonnet 5.5: sin dato del nivel que corresponde, vale la política de modelos (una pregunta con «sí»: hay que juntar y contrastar fuentes → sonnet; ante la duda entre low y medium, el de abajo)."
      evidencia: []
      palabras:
        - "investig*"
        - research
        - en la web
        - relevar
        - relevamiento
        - "scrap*"
    - id: arquitectura_seguridad_plata
      corto: "arquitectura, seguridad o plata"
      tarea: "Arquitectura, seguridad, dinero o algo irreversible (planear en Claude; la revisión puede ir a otra IA)"
      nivel: opus
      esfuerzo: high
      otra_ia: revision
      verificado: false
      sin_dato: "No hay evidencia independiente de arquitectura ni de seguridad (las fuentes de revisión de código —Qodo, ironbee, cross-review— no miden arquitectura ni seguridad): vale la política de modelos tal cual. Hay que juzgar y el error sale caro (2 «sí») → opus/high."
      evidencia: []
      palabras:
        - "arquitectur*"
        - architect
        - seguridad
        - security
        - "vulnerab*"
        - dinero
        - plata
        - pago
        - payment
        - "finanz*"
        - "financ*"
        - legal
        - legales
        - contrato
        - irreversible
        - produccion
        - production
        - migracion
        - diseno de sistema
categorias:
  - id: desarrollo
    nombre: "Desarrollo (programar)"
    evidencia:
      - fuente: Artificial Analysis Coding Agent Index v2.0
        url: "https://artificialanalysis.ai/agents/coding-agents"
        tipo: independiente
        dice: "Claude Code+Opus 5.5 62; Antigravity+Gemini 4 Carbon 59 (sin acceso general todavía); Claude Code+Sonnet 5.5 59; Claude Code+Fable 5.1 58; Codex+GPT-6 Astra 55; Codex+GPT-6.1 Sol 54; Antigravity+Gemini 4 Argon 53. Versión 2.0: no se compara con la 1.5 (antes Sonnet 68, Opus 66, Argon 64, Sol 63)."
        conflicto: "Artificial Analysis: empresa comercial, vende datos y asesoría"
        fecha: 2026-10-29
      - fuente: "Terminal-Bench 4.0 (tabla de Snorkel AI)"
        url: "https://snorkel.ai/leaderboard/terminal-bench/"
        tipo: independiente
        dice: "Claude Code+Opus 5.5 64,8%; Claude Code+Sonnet 5.5 61,8%; Codex+GPT-6 Astra 58,2%; Codex+GPT-6.1 Sol 58,2%; Claude Code+Fable 5.1 57,9%. Costo de la corrida en esa tabla: GPT-6.1 Sol US$0,6k, GPT-6 Astra US$3,3k"
        conflicto: "Terminal-Bench: muchos envíos los hace el fabricante; se lee la tabla de Snorkel AI (actualizada el 2026-10-27)"
        fecha: 2026-10-27
      - fuente: Arena WebDev
        url: "https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset"
        tipo: independiente
        dice: "1 Claude Opus 5.5 (Max) 1810, 2 GPT-6 Astra 1773, 3 Claude Sonnet 5.5 1770, 4 Gemini 4 Carbon 1768, 5 GPT-6.1 Sol 1751, 11 Gemini 4 Argon 1679, 37 Gemini 3.8 Flash 1583"
        conflicto: "Arena mide preferencia humana en una tarea de páginas web, no corrección del código"
        fecha: 2026-10-28
    planes:
      - plan: A
        herramienta: Claude Code
        proveedor: Anthropic
        modelo: Opus 5.5
        modelo_api: claude-opus-5-5
        por_que: "Primero en las tres fuentes: índice de agentes de programación de Artificial Analysis (Claude Code con Opus 5.5: 62), Terminal-Bench 4.0 (64,8%) y Arena WebDev (1810). Sonnet 5.5 rinde casi igual y cuesta menos (59, 61,8% y 1770): para lo rutinario."
        fuente: "evidencia de la categoría"
        fecha: 2026-10-29
        datos_privados: true
        condiciones: ""
        como_ver_cupo: /usage en Claude Code
        cupo: claude
        verificado: true
        respaldo:
          - Artificial Analysis Coding Agent Index v2.0
          - "Terminal-Bench 4.0 (tabla de Snorkel AI)"
          - Arena WebDev
      - plan: B
        herramienta: Codex
        proveedor: OpenAI
        modelo: GPT-6.1 Sol
        modelo_api: gpt-6.1-sol
        por_que: "Codex con GPT-6.1 Sol: 54 en el índice de Artificial Analysis (con GPT-6 Astra, 55), 58,2% en Terminal-Bench 4.0 (igual que Astra, a una quinta parte del costo en esa tabla) y 5.º en Arena WebDev (1751). Otro modelo encuentra otros errores."
        fuente: "evidencia de la categoría"
        fecha: 2026-10-29
        datos_privados: true
        condiciones: "Con cuenta gratis, revisá la privacidad de la cuenta antes de mandar código privado."
        como_ver_cupo: "/status en Codex, o bash scripts/codex-cupo"
        cupo: codex
        verificado: true
        respaldo:
          - Artificial Analysis Coding Agent Index v2.0
          - "Terminal-Bench 4.0 (tabla de Snorkel AI)"
          - Arena WebDev
      - plan: C
        herramienta: Antigravity
        proveedor: Google
        modelo: Gemini 4 Argon
        modelo_api: gemini-4-argon
        por_que: "Gemini 4 Argon queda a un punto de Codex en el índice (53 contra 54) pero 11.º contra 5.º en Arena WebDev (1679 contra 1751): empate técnico, se deja B por tener más historia. Gemini 3.8 Flash, el modelo que figuraba acá, rinde mucho menos (37.º en Arena WebDev, 1583). Gemini 4 Carbon (59 en el índice, 4.º en WebDev) todavía no tiene acceso general: cuando salga es candidato a plan B."
        fuente: "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-argon/"
        fecha: 2026-10-29
        datos_privados: false
        condiciones: "Gemini 4 Argon en Antigravity es solo para suscriptores de Google AI Ultra (en la app de Gemini, desde AI Pro; por API, US$2/10 por millón hasta el 30/11/2026 y US$4/20 después, según Google). Con otra cuenta, Antigravity usa el mejor Gemini que tenga (delegar.py lo resuelve solo). En el plan gratis Google usa lo que mandás para mejorar sus productos: sin código privado ni datos de clientes."
        como_ver_cupo: /usage en Antigravity CLI
        cupo: antigravity
        verificado: false
        respaldo:
          - Artificial Analysis Coding Agent Index v2.0
          - Arena WebDev
    ranking:
      fuente: "Arena (dataset en Hugging Face)"
      fecha: 2026-10-29
      verificado: false
      items:
        - puesto: 1
          modelo: "Claude Opus 5.5 (Max)"
          puntaje: 1810
        - puesto: 2
          modelo: "GPT-6 Astra (Max)"
          puntaje: 1773
        - puesto: 3
          modelo: "Claude Sonnet 5.5 (xHigh)"
          puntaje: 1770
        - puesto: 4
          modelo: "Gemini 4 Carbon (High)"
          puntaje: 1768
        - puesto: 5
          modelo: "GPT-6.1 Sol (Max)"
          puntaje: 1751
    arena:
      config: webdev
      split: latest
      verificado: false
  - id: revision
    nombre: "Revisión de código y seguridad"
    planes:
      - plan: A
        herramienta: Claude Code
        proveedor: Anthropic
        modelo: Opus 5.5
        modelo_api: claude-opus-5-5
        por_que: "Mejor revisor en Qodo (F1 56,8%) y en el grupo de arriba en ironbee (55,1); en cross-review empata con Codex y queda a 0,05 de Gemini 4 Argon, con la mitad de falsas alarmas de Codex y la corrida más rápida (141 s). `/code-review` y `/security-review`."
        fuente: "https://www.qodo.ai/blog/which-llm-should-review-your-code/"
        fecha: 2026-10-29
        datos_privados: true
        condiciones: ""
        como_ver_cupo: /usage en Claude Code
        cupo: claude
        verificado: true
        respaldo:
          - "Qodo, ¿qué modelo conviene para revisar código? (13 modelos)"
          - "ironbee-ai/code-review-benchmarks (21 modelos, 50 pull requests)"
          - "cross-review benchmark (Codex, Claude Code y Antigravity)"
      - plan: B
        herramienta: Antigravity
        proveedor: Google
        modelo: Gemini 4 Argon
        modelo_api: gemini-4-argon
        por_que: "El revisor más preciso: el 87% de lo que marca es un error real y casi no da falsas alarmas (5%). Gana en F1 a Codex de forma significativa (0,780 contra 0,707) y queda en el grupo 2 de ironbee, por encima de GPT-6.1 Sol (grupo 4). Se le escapan los errores que piden leer más allá del diff (acierta 75-83% en esos): usalo como segunda opinión, no solo. Sin ejecutar nada: `agy --mode plan -p=...`."
        fuente: "https://cross-review.tlelabs.com/benchmark/"
        fecha: 2026-10-29
        datos_privados: false
        condiciones: "Gemini 4 Argon en Antigravity es solo para suscriptores de Google AI Ultra (en la app de Gemini, desde AI Pro; por API, US$2/10 por millón hasta el 30/11/2026 y US$4/20 después, según Google). Con otra cuenta, Antigravity usa el mejor Gemini que tenga (delegar.py lo resuelve solo). Con Gemini 3.8 Flash la revisión queda a la par de Codex (47,0% contra 46,6% en Qodo). En el plan gratis Google usa lo que mandás para mejorar sus productos: sin código privado ni datos de clientes."
        como_ver_cupo: /usage en Antigravity CLI
        cupo: antigravity
        verificado: true
        respaldo:
          - "ironbee-ai/code-review-benchmarks (21 modelos, 50 pull requests)"
          - "cross-review benchmark (Codex, Claude Code y Antigravity)"
      - plan: C
        herramienta: Codex
        proveedor: OpenAI
        modelo: GPT-6.1 Sol
        modelo_api: gpt-6.1-sol
        por_que: "Encuentra casi todos los errores (Codex con GPT-6 Astra: 92% en cross-review) pero marca de más (48% de falsas alarmas); GPT-6.1 Sol queda en el grupo 4 de ironbee (F1 43,7) y los GPT-6 detrás de Claude en Qodo. Úsalo cuando el código es privado o cuando importa no dejar pasar nada: `codex exec --sandbox read-only`."
        fuente: "https://github.com/ironbee-ai/code-review-benchmarks"
        fecha: 2026-10-29
        datos_privados: true
        condiciones: ""
        como_ver_cupo: "/status en Codex, o bash scripts/codex-cupo"
        cupo: codex
        verificado: true
        respaldo:
          - "Qodo, ¿qué modelo conviene para revisar código? (13 modelos)"
          - "ironbee-ai/code-review-benchmarks (21 modelos, 50 pull requests)"
          - "cross-review benchmark (Codex, Claude Code y Antigravity)"
    ranking:
      fuente: "sin ranking cargado todavía"
      fecha: null
      verificado: false
      items: []
    evidencia:
      - fuente: "Qodo, ¿qué modelo conviene para revisar código? (13 modelos)"
        url: "https://www.qodo.ai/blog/which-llm-should-review-your-code/"
        tipo: independiente
        dice: "F1 revisando pull requests: Claude Opus 5.5 56,8%, Claude Sonnet 5.5 54,9%, GPT-6 Sol 48,7%, Gemini 3.8 Flash 47,0%, GPT-6 Astra 46,6%. No mide GPT-6.1 Sol ni Gemini 4."
        conflicto: "Qodo vende un producto de revisión de código"
        fecha: 2026-10-12
      - fuente: "ironbee-ai/code-review-benchmarks (21 modelos, 50 pull requests)"
        url: "https://github.com/ironbee-ai/code-review-benchmarks"
        tipo: independiente
        dice: "Grupo 1 (empatados arriba): Claude Sonnet 5.5 F1 56,0 y Claude Opus 5.5 55,1; grupo 2: Gemini 4 Argon 54,3; grupo 4: GPT-6.1 Sol 43,7; grupo 5: GPT-6 Luna 43,7."
        conflicto: "Los jueces son modelos de IA de otras familias; repositorio de un solo autor"
        fecha: 2026-10-20
      - fuente: "cross-review benchmark (Codex, Claude Code y Antigravity)"
        url: "https://cross-review.tlelabs.com/benchmark/"
        tipo: independiente
        dice: "144 pull requests con errores sembrados: Antigravity+Gemini 4 Argon F1 0,780 (acierta el 87% de lo que marca, encuentra el 71% de los errores y da 5% de falsas alarmas); Claude Code+Opus 5.5 0,732 (89% de los errores, 21% de falsas alarmas, la corrida más rápida: 141 s la mediana); Codex+GPT-6 Astra 0,707 (92% de los errores, 48% de falsas alarmas). En los errores difíciles (los que piden leer más allá del diff o ejecutar el código) Antigravity recupera entre 75% y 83%, Codex y Claude Code 95-99%. Con 21 errores reales el orden se invierte, sin diferencia significativa."
        conflicto: "El conjunto de prueba lo escribió Claude y los jueces son los tres competidores"
        fecha: 2026-10-26
  - id: diseno
    nombre: "Diseño (UI web, presentaciones)"
    evidencia:
      - fuente: Arena WebDev
        url: "https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset"
        tipo: independiente
        dice: "1 Claude Opus 5.5 (Max) 1810, 2 GPT-6 Astra 1773, 3 Claude Sonnet 5.5 1770, 4 Gemini 4 Carbon 1768, 5 GPT-6.1 Sol 1751, 11 Gemini 4 Argon 1679, 37 Gemini 3.8 Flash 1583"
        conflicto: "Arena: vende evaluaciones a los labs que rankea; mide gusto, no corrección"
        fecha: 2026-10-28
      - fuente: Design Arena
        url: "https://www.designarena.ai/leaderboard"
        tipo: independiente
        dice: "1 Claude Opus 5.5 1396, 2 GPT-6 Astra (xhigh) 1388, 3 Kimi K3 1372 (no releída el 2026-10-29)"
        conflicto: "Design Arena: empresa que vende evaluaciones; votos del público"
        fecha: 2026-10-03
    planes:
      - plan: A
        herramienta: Claude Code
        proveedor: Anthropic
        modelo: Opus 5.5
        modelo_api: claude-opus-5-5
        por_que: "Primero en Arena WebDev (1810 contra 1773 de GPT-6 Astra) y en Design Arena (al 2026-10-03, no releída hoy); con la skill de diseño del plugin que corresponda."
        fuente: docs/specs/INVESTIGACION-radar-de-modelos.md
        fecha: 2026-10-29
        datos_privados: true
        condiciones: ""
        como_ver_cupo: /usage en Claude Code
        cupo: claude
        verificado: false
        respaldo:
          - Arena WebDev
          - Design Arena
      - plan: B
        herramienta: Codex
        proveedor: OpenAI
        modelo: GPT-6.1 Sol
        modelo_api: gpt-6.1-sol
        por_que: "GPT-6.1 Sol es 5.º en Arena WebDev (1751); GPT-6 Astra (también en Codex) es 2.º (1773) y 2.º en Design Arena: sirve de segunda opinión de diseño."
        fuente: docs/specs/INVESTIGACION-radar-de-modelos.md
        fecha: 2026-10-29
        datos_privados: true
        condiciones: ""
        como_ver_cupo: "/status en Codex, o bash scripts/codex-cupo"
        cupo: codex
        verificado: false
        respaldo:
          - Arena WebDev
      - plan: C
        herramienta: Antigravity
        proveedor: Google
        modelo: Gemini 4 Argon
        modelo_api: gemini-4-argon
        por_que: "Gemini 4 Argon es 11.º en Arena WebDev (1679); Gemini 3.8 Flash, el que figuraba acá, 37.º (1583). Gemini 4 Carbon, 4.º (1768), todavía sin acceso general. Para bocetos; no para material de clientes."
        fuente: "https://antigravity.google/docs/plans"
